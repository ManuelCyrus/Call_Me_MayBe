[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling via constrained decoding over a small local LLM."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.8",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
exclude = ["^llm_sdk/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
